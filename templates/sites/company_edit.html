{% extends "master.html" %}
{% block title %}Edit Company Profile | Pending{% endblock %}

{% block content %}
<div class="form-page">
    <p class="eyebrow">Interior Designer</p>
    <h2>Company Profile</h2>

    <form method="post" action="{{ url_for('company_edit') }}">
        <div class="form-group">
            <label class="form-label" for="name">Company Name</label>
            <input class="form-control" id="name" name="name" type="text"
                   value="{{ company.name or '' }}" placeholder="e.g. Studio Forma">
        </div>

        <div class="form-group">
            <label class="form-label" for="description">About / Description</label>
            <textarea class="form-control" id="description" name="description"
                      rows="5" placeholder="Describe your studio, approach and services">{{ company.description or '' }}</textarea>
        </div>

        <div class="form-group">
            <label class="form-label" for="contact_info">Contact Information</label>
            <input class="form-control" id="contact_info" name="contact_info" type="text"
                   value="{{ company.contact_info or '' }}" placeholder="e.g. hello@studiofoma.com · +65 9123 4567">
        </div>

        <div class="form-actions">
            <button class="button" type="submit">Save</button>
            <a class="btn-sm" href="{{ url_for('company_preview') }}">Preview Company Page</a>
            <a class="btn-sm" href="{{ url_for('designer_dashboard') }}">← Back to Dashboard</a>
        </div>
    </form>
</div>
{% endblock %}
