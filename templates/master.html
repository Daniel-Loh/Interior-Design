<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Pending · Find your interior designer{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="site-header">
        <a class="logo" href="/">pending.</a>
        <nav>
            {% if session.get('role') == 'designer' %}
                <a href="{{ url_for('designer_dashboard') }}">Dashboard</a>
                <a href="{{ url_for('company_edit') }}">Company Profile</a>
                <a href="{{ url_for('company_preview') }}">Preview Page</a>
                <a class="sign-in-link" href="{{ url_for('logout') }}">Sign out</a>
            {% else %}
                <a href="/">Home</a>
                <a href="#designers">Find a designer</a>
                <a href="#projects">ID projects</a>
                <a href="#about">About</a>
                <a class="sign-in-link" href="{{ url_for('login') }}">Sign in</a>
            {% endif %}
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <p>Pending · Find an interior designer for your home</p>
    </footer>
</body>
</html>
